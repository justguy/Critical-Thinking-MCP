name: Claims Ledger

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate claims ledger and scan tracked docs
        run: node scripts/check-claims-ledger.mjs
